[project]
name = "backtesting"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jupyterlab>=4.6.3",
    "metatrader5>=5.0.6090",
    "numpy>=2.4.6",
